name: Build PowerEssentials

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Extract source
        run: |
          unzip -q PowerEssentials-Nukkit-stable.zip -d source
          POM=$(find source -name pom.xml | head -n 1)
          echo "POM=$POM" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname "$POM")" >> $GITHUB_ENV

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          mvn -B package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PowerEssentials-JAR
          path: "${{ env.PROJECT_DIR }}/target/*.jar"
